<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azra Course – Basic Syntax</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-50 text-gray-800">
  <section class="bg-indigo-600 text-white py-4">
    <div class="max-w-4xl mx-auto text-center">
      <h1 class="text-2xl font-bold">Azra – Basic Syntax</h1>
    </div>
  </section>
  <nav class="max-w-4xl mx-auto py-2">
    <a href="index.html" class="text-indigo-600 hover:underline">← Back to Index</a>
  </nav>
  <section class="max-w-4xl mx-auto px-4 py-8">
    <p>Azra programs consist of statements, each ending with a newline. Indentation defines blocks, similar to Python.</p>
    <h3 class="font-semibold mt-4">Hello World</h3>
    <pre class="bg-gray-100 p-2 rounded"><code class="language-azra">say "Hello, world!"</code></pre>
    <h3 class="font-semibold mt-4">Comments</h3>
    <pre class="bg-gray-100 p-2 rounded"><code class="language-azra"># This is a comment
say "Hi"
</code></pre>
  </section>
  <footer class="bg-indigo-600 text-white py-4 mt-12">
    <div class="max-w-4xl mx-auto text-center">
      <p>© 2026 Azra Language – All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
